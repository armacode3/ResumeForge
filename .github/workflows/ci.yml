name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies and project
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check types
        run: python -m mypy
      - name: Unit tests
        run: python -m pytest tests/unit
      - name: Installed CLI integration tests
        run: python -m pytest tests/integration
      - name: Full suite with coverage
        run: python -m pytest --cov=resumeforge --cov-report=term-missing
      - name: Build distribution
        run: python -m build --no-isolation
      - name: Install wheel and smoke test outside repository
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/resumeforge-smoke"
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" -m pip install -c requirements-dev.lock dist/*.whl
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" --version
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" -m resumeforge --help
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" validate-profile --profile "$GITHUB_WORKSPACE/examples/profiles/sample.md"
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" analyze-job \
            --job "$GITHUB_WORKSPACE/examples/jobs/backend_intern.md" \
            --mock-response "$GITHUB_WORKSPACE/examples/jobs/backend_intern.response.json" \
            > "$RUNNER_TEMP/offline-job-analysis.json"
          test -s "$RUNNER_TEMP/offline-job-analysis.json"
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" match-evidence \
            --profile "$GITHUB_WORKSPACE/examples/profiles/sample.md" \
            --job "$GITHUB_WORKSPACE/examples/jobs/backend_intern.md" \
            --requirements "$GITHUB_WORKSPACE/examples/jobs/backend_intern.response.json" \
            --confirm-review > "$RUNNER_TEMP/evidence-matching.json"
          test -s "$RUNNER_TEMP/evidence-matching.json"
          plan_status=0
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" plan-resume \
            --profile "$GITHUB_WORKSPACE/examples/profiles/sample.md" \
            --job "$GITHUB_WORKSPACE/examples/jobs/backend_intern.md" \
            --requirements "$GITHUB_WORKSPACE/examples/jobs/backend_intern.response.json" \
            --selection "$GITHUB_WORKSPACE/examples/plans/backend_intern.selection.json" \
            --confirm-review > "$RUNNER_TEMP/resume-plan.json" || plan_status=$?
          test "$plan_status" -eq 3
          review_status=0
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" review-resume \
            --profile "$GITHUB_WORKSPACE/examples/profiles/sample.md" \
            --job "$GITHUB_WORKSPACE/examples/jobs/backend_intern.md" \
            --requirements "$GITHUB_WORKSPACE/examples/jobs/backend_intern.response.json" \
            --selection "$GITHUB_WORKSPACE/examples/plans/backend_intern.selection.json" \
            --confirm-review > "$RUNNER_TEMP/resume-review.json" || review_status=$?
          test "$review_status" -eq 3
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidence-matching.json").read_text())
          assert report["signals_version"] == "evidence-signals-v1"
          candidates = [candidate for item in report["items"] for candidate in item["candidates"]]
          assert candidates and all("signals" in candidate for candidate in candidates)
          plan = json.loads(Path("resume-plan.json").read_text())
          assert plan["status"] == "needs_review" and plan["constraint_status"] == "conflicts"
          assert plan["budget"]["bullet_slot_count"] == 2
          assert any(f["code"] == "entry_bullet_minimum_not_met" for f in plan["findings"])
          review = json.loads(Path("resume-review.json").read_text())
          assert review["mode"] == "source_seed" and review["status"] == "blocked_by_plan"
          assert len(review["bullets"]) == 2
          assert all(b["review_status"] == "pending_review" for b in review["bullets"])
          Path("resume-draft.json").write_text(json.dumps(review["document"]))
          Path("review-decisions.json").write_text(json.dumps({
              "schema_version": 3,
              "review_version": review["review_version"],
              "plan_sha256": review["document"]["plan_sha256"],
              "document_sha256": review["document_sha256"],
              "findings_sha256": review["findings_sha256"],
              "fragments_sha256": review["fragments_sha256"],
              "bullets": [{"bullet_id": b["bullet_id"], "decision": "approve",
                           "acknowledged_finding_ids": [],
                           "fragment_decisions": [],
                           "reason": "Fictional CI assertion: plan conflicts must block approval."}
                          for b in review["bullets"]],
          }))
          PY
          decision_status=0
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" review-resume \
            --profile "$GITHUB_WORKSPACE/examples/profiles/sample.md" \
            --job "$GITHUB_WORKSPACE/examples/jobs/backend_intern.md" \
            --requirements "$GITHUB_WORKSPACE/examples/jobs/backend_intern.response.json" \
            --selection "$GITHUB_WORKSPACE/examples/plans/backend_intern.selection.json" \
            --draft "$RUNNER_TEMP/resume-draft.json" \
            --decisions "$RUNNER_TEMP/review-decisions.json" \
            --confirm-review --confirm-decisions > "$RUNNER_TEMP/decision-result.json" || decision_status=$?
          test "$decision_status" -eq 3
          metadata_status=0
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" review-metadata \
            --profile "$GITHUB_WORKSPACE/examples/profiles/sample.md" \
            --job "$GITHUB_WORKSPACE/examples/jobs/backend_intern.md" \
            --requirements "$GITHUB_WORKSPACE/examples/jobs/backend_intern.response.json" \
            --selection "$GITHUB_WORKSPACE/examples/plans/backend_intern.selection.json" \
            --draft "$RUNNER_TEMP/resume-draft.json" \
            --metadata-selection "$GITHUB_WORKSPACE/examples/metadata/backend_intern.fields.json" \
            --confirm-review > "$RUNNER_TEMP/metadata-review.json" || metadata_status=$?
          test "$metadata_status" -eq 3
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("decision-result.json").read_text())
          assert result["status"] == "blocked_by_plan"
          assert result["scope"] == "bullet_wording_only" and not result["rendering_authorized"]
          assert all(b["review_status"] == "blocked_by_plan" for b in result["bullets"])
          metadata = json.loads(Path("metadata-review.json").read_text())
          assert metadata["status"] == "blocked_by_plan"
          assert metadata["scope"] == "selected_metadata_only" and not metadata["rendering_authorized"]
          assert metadata["document"]["metadata_version"] == "source-bound-metadata-v1"
          assert all(f["review_status"] == "pending_review" for f in metadata["document"]["fields"])
          values = {f["source_ref"]: f["value"] for f in metadata["document"]["fields"]}
          assert values["person.email"] == "alex@example.com"  # explicitly selected fictional contact
          assert "person.phone" not in values
          assert values["projects.proj_queue.end_date"] == "present"
          assert values["education.edu_example.end_date"] == "2027-05"
          assert metadata["wording_review"]["document"]["status"] == "needs_review"
          Path("metadata-decisions.json").write_text(json.dumps({
              "schema_version": 1, "decision_version": "metadata-field-decisions-v1",
              "metadata_version": metadata["document"]["metadata_version"],
              "plan_sha256": metadata["document"]["plan_sha256"],
              "wording_document_sha256": metadata["document"]["wording_document_sha256"],
              "metadata_selection_sha256": metadata["document"]["metadata_selection_sha256"],
              "metadata_document_sha256": metadata["document_sha256"],
              "fields": [{"source_ref": f["source_ref"], "decision": "approve",
                          "reason": "Fictional gate assertion; plan conflicts must block approval."}
                         for f in metadata["document"]["fields"]],
          }))
          PY
          metadata_decision_status=0
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" review-metadata \
            --profile "$GITHUB_WORKSPACE/examples/profiles/sample.md" \
            --job "$GITHUB_WORKSPACE/examples/jobs/backend_intern.md" \
            --requirements "$GITHUB_WORKSPACE/examples/jobs/backend_intern.response.json" \
            --selection "$GITHUB_WORKSPACE/examples/plans/backend_intern.selection.json" \
            --draft "$RUNNER_TEMP/resume-draft.json" \
            --metadata-selection "$GITHUB_WORKSPACE/examples/metadata/backend_intern.fields.json" \
            --decisions "$RUNNER_TEMP/metadata-decisions.json" --confirm-review --confirm-decisions \
            > "$RUNNER_TEMP/metadata-decision-result.json" || metadata_decision_status=$?
          test "$metadata_decision_status" -eq 3
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("metadata-decision-result.json").read_text())
          assert result["status"] == "blocked_by_plan"
          assert result["scope"] == "selected_metadata_only" and not result["rendering_authorized"]
          assert all(f["review_status"] == "blocked_by_plan" for f in result["fields"])
          assert all(f["review_status"] == "pending_review" for f in result["review"]["document"]["fields"])
          PY
          assembly_status=0
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" assemble-resume \
            --profile "$GITHUB_WORKSPACE/examples/profiles/sample.md" \
            --job "$GITHUB_WORKSPACE/examples/jobs/backend_intern.md" \
            --requirements "$GITHUB_WORKSPACE/examples/jobs/backend_intern.response.json" \
            --selection "$GITHUB_WORKSPACE/examples/plans/backend_intern.selection.json" \
            --draft "$RUNNER_TEMP/resume-draft.json" \
            --metadata-selection "$GITHUB_WORKSPACE/examples/metadata/backend_intern.fields.json" \
            --confirm-review > "$RUNNER_TEMP/assembly.json" || assembly_status=$?
          test "$assembly_status" -eq 3
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("assembly.json").read_text())
          assert result["status"] == "blocked_by_plan"
          assert any(i["code"] == "plan_conflict" for i in result["issues"])
          assert result["document"]["sections"][0]["entries"][0]["bullets"] == []
          assert not result["rendering_authorized"]
          PY
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          profile = Path("finding-profile.md").resolve()
          profile.write_text((root / "examples/profiles/sample.md").read_text().replace(
              "min_bullets_per_entry: 1", "min_bullets_per_entry: 0"))
          args = [sys.executable, "-m", "resumeforge", "review-resume", "--profile", str(profile),
                  "--job", str(root / "examples/jobs/backend_intern.md"),
                  "--requirements", str(root / "examples/jobs/backend_intern.response.json"),
                  "--selection", str(root / "examples/plans/backend_intern.selection.json"),
                  "--confirm-review"]

          def run(options, expected):
              process = subprocess.run(args + options, capture_output=True, text=True,
                                       check=False, timeout=10)
              assert process.returncode == expected, process.stderr
              return json.loads(process.stdout)

          seed = run([], 0)
          draft = seed["document"]
          draft["sections"][1]["entries"][0]["bullets"][0]["text"] = "Owned 99 endpoints."
          Path("finding-draft.json").write_text(json.dumps(draft))
          draft_args = ["--draft", "finding-draft.json"]
          review = run(draft_args, 0)
          assert review["findings_version"] == "literal-claim-findings-v1"
          assert len(review["bullets"][0]["findings"]) == 2
          decisions = {"schema_version": 3, "review_version": review["review_version"],
                       "plan_sha256": review["document"]["plan_sha256"],
                       "document_sha256": review["document_sha256"],
                       "findings_sha256": review["findings_sha256"],
                       "fragments_sha256": review["fragments_sha256"],
                       "bullets": [{"bullet_id": b["bullet_id"], "decision": "approve",
                                    "reason": "Synthetic gate assertion, not factual proof.",
                                    "acknowledged_finding_ids": [],
                                    "fragment_decisions": []} for b in review["bullets"]]}
          for acknowledged in (False, True):
              if acknowledged:
                  decisions["bullets"][0]["acknowledged_finding_ids"] = [
                      f["id"] for f in review["bullets"][0]["findings"]]
              Path("finding-decisions.json").write_text(json.dumps(decisions))
              result = run(draft_args + ["--decisions", "finding-decisions.json",
                                         "--confirm-decisions"], 3)
              assert result["status"] == "needs_review"
              assert result["bullets"][0]["unreviewed_fragment_ids"]
              assert result["review"]["document"] == draft
              assert result["review"]["bullets"][0]["findings"] == review["bullets"][0]["findings"]
              assert not result["rendering_authorized"]
          for choice, bullet in zip(decisions["bullets"], review["bullets"], strict=True):
              choice["fragment_decisions"] = [{"fragment_id": f["id"],
                  "disposition": "omission_accepted", "draft_span": None,
                  "reason": "Synthetic gate assertion only, not factual approval."}
                  for f in bullet["source_fragments"]]
          Path("finding-decisions.json").write_text(json.dumps(decisions))
          result = run(draft_args + ["--decisions", "finding-decisions.json",
                                    "--confirm-decisions"], 0)
          assert result["status"] == "bullet_wording_approved_by_user"
          assert result["review"]["bullets"][0]["source_fragments"]
          assert not result["rendering_authorized"]
          worksheet = run(draft_args + ["--worksheet"], 0)
          assert worksheet["worksheet_version"] == "pending-review-worksheet-v1"
          assert worksheet["review"]["document"] == draft
          assert not worksheet["rendering_authorized"]
          template = worksheet["decision_template"]
          assert template["document_sha256"] == review["document_sha256"]
          for pending, bullet in zip(template["bullets"], review["bullets"], strict=True):
              assert pending["decision"] is pending["reason"] is None
              assert pending["acknowledged_finding_ids"] == []
              assert [f["fragment_id"] for f in pending["fragment_decisions"]] == [
                  f["id"] for f in bullet["source_fragments"]]
              assert all(f["disposition"] is f["reason"] is f["draft_span"] is None
                         for f in pending["fragment_decisions"])
          Path("pending-template.json").write_text(json.dumps(template))
          untouched = subprocess.run(args + draft_args + ["--decisions", "pending-template.json",
                                     "--confirm-decisions"], capture_output=True, text=True,
                                     check=False, timeout=10)
          assert untouched.returncode == 1 and untouched.stdout == ""
          metadata_args = args.copy()
          metadata_args[3] = "review-metadata"
          metadata_args += draft_args + ["--metadata-selection",
              str(root / "examples/metadata/backend_intern.fields.json")]

          def run_metadata(options, expected):
              process = subprocess.run(metadata_args + options, capture_output=True, text=True,
                                       check=False, timeout=10)
              assert process.returncode == expected, process.stderr
              return json.loads(process.stdout)

          metadata = run_metadata([], 0)
          doc = metadata["document"]
          choices = {"schema_version": 1, "decision_version": "metadata-field-decisions-v1",
              "metadata_version": doc["metadata_version"], "plan_sha256": doc["plan_sha256"],
              "wording_document_sha256": doc["wording_document_sha256"],
              "metadata_selection_sha256": doc["metadata_selection_sha256"],
              "metadata_document_sha256": metadata["document_sha256"],
              "fields": [{"source_ref": f["source_ref"], "decision": "approve",
                          "reason": "Fictional metadata gate assertion; not factual proof."}
                         for f in doc["fields"]]}
          Path("complete-metadata-decisions.json").write_text(json.dumps(choices))
          result = run_metadata(["--decisions", "complete-metadata-decisions.json",
                                 "--confirm-decisions"], 0)
          assert result["status"] == "metadata_fields_approved_by_user"
          assert result["review"]["wording_review"]["bullets"][0]["findings"]
          assert all(b["review_status"] == "pending_review"
                     for b in result["review"]["wording_review"]["bullets"])
          assert not result["rendering_authorized"]
          assembly_args = args.copy()
          assembly_args[3] = "assemble-resume"
          assembly_args += draft_args + ["--metadata-selection",
              str(root / "examples/metadata/backend_intern.fields.json")]
          for complete in (False, True):
              options = ["--metadata-decisions", "complete-metadata-decisions.json",
                         "--confirm-metadata-decisions"]
              if complete:
                  options += ["--bullet-decisions", "finding-decisions.json",
                              "--confirm-bullet-decisions"]
              process = subprocess.run(assembly_args + options, capture_output=True, text=True,
                                       check=False, timeout=10)
              assert process.returncode == (0 if complete else 3), process.stderr
              result = json.loads(process.stdout)
              assert result["status"] == ("components_reviewed" if complete else "needs_review")
              assert result["review"]["wording_review"]["bullets"][0]["findings"]
              assert result["document"]["status"] == "needs_review"
              assert not result["rendering_authorized"]
          seed = run([], 0)
          response = {"schema_version": 1,
                      "plan_sha256": seed["document"]["plan_sha256"],
                      "seed_document_sha256": seed["document_sha256"],
                      "bullets": [{"bullet_id": b["bullet_id"],
                                   "accomplishment_id": b["accomplishment_id"],
                                   "text": b["source_statement"]} for b in seed["bullets"]]}
          response["bullets"][0]["text"] = "Owned 99 endpoints."
          Path("wording-response.json").write_text(json.dumps(response))
          wording_args = args.copy()
          wording_args[3] = "suggest-wording"
          process = subprocess.run(wording_args + ["--mock-response", "wording-response.json"],
                                   capture_output=True, text=True, check=False, timeout=10)
          assert process.returncode == 0, process.stderr
          result = json.loads(process.stdout)
          assert result["attempt"]["provider"] == "fake"
          assert result["review"]["mode"] == "submitted_draft"
          assert len(result["review"]["bullets"][0]["findings"]) == 2
          assert all(b["review_status"] == "pending_review" for b in result["review"]["bullets"])
          assert not result["rendering_authorized"]
          PY
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" \
            "$GITHUB_WORKSPACE/scripts/evaluate_wording.py" > "$RUNNER_TEMP/wording-evaluation.json"
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("wording-evaluation.json").read_text())
          assert report["mode"] == "source_seed_replay"
          assert report["total_cases"] == report["validated_cases"] == 6
          assert report["inspected_bullets"] == 7
          assert report["edited_bullets"] == report["literal_findings"] == 0
          assert report["manual_review_status"] == "not_performed"
          assert not report["rendering_authorized"]
          PY
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" \
            "$GITHUB_WORKSPACE/scripts/evaluate_wording.py" \
            --suite rewrite_holdout --objective concise_rewrite > "$RUNNER_TEMP/rewrite-evaluation.json"
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("rewrite-evaluation.json").read_text())
          assert report["suite"] == "rewrite_holdout" and report["objective"] == "concise_rewrite"
          assert report["mode"] == "source_seed_replay"
          assert report["prompt_version"] == "source-bound-wording-prompt-v2"
          assert report["total_cases"] == report["validated_cases"] == 3
          assert report["inspected_bullets"] == 4
          assert report["source_characters"] == report["draft_characters"]
          assert report["edited_bullets"] == 0
          assert report["manual_review_status"] == "not_performed"
          assert not report["rendering_authorized"]
          PY
