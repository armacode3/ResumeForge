name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies and project
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check types
        run: python -m mypy
      - name: Unit tests
        run: python -m pytest tests/unit
      - name: Installed CLI integration tests
        run: python -m pytest tests/integration
      - name: Full suite with coverage
        run: python -m pytest --cov=resumeforge --cov-report=term-missing
      - name: Build distribution
        run: python -m build --no-isolation
      - name: Install wheel and smoke test outside repository
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/resumeforge-smoke"
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" -m pip install -c requirements-dev.lock dist/*.whl
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" --version
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" -m resumeforge --help
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" validate-profile --profile "$GITHUB_WORKSPACE/examples/profiles/sample.md"
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" analyze-job \
            --job "$GITHUB_WORKSPACE/examples/jobs/backend_intern.md" \
            --mock-response "$GITHUB_WORKSPACE/examples/jobs/backend_intern.response.json" \
            > "$RUNNER_TEMP/offline-job-analysis.json"
          test -s "$RUNNER_TEMP/offline-job-analysis.json"
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" match-evidence \
            --profile "$GITHUB_WORKSPACE/examples/profiles/sample.md" \
            --job "$GITHUB_WORKSPACE/examples/jobs/backend_intern.md" \
            --requirements "$GITHUB_WORKSPACE/examples/jobs/backend_intern.response.json" \
            --confirm-review > "$RUNNER_TEMP/evidence-matching.json"
          test -s "$RUNNER_TEMP/evidence-matching.json"
          plan_status=0
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" plan-resume \
            --profile "$GITHUB_WORKSPACE/examples/profiles/sample.md" \
            --job "$GITHUB_WORKSPACE/examples/jobs/backend_intern.md" \
            --requirements "$GITHUB_WORKSPACE/examples/jobs/backend_intern.response.json" \
            --selection "$GITHUB_WORKSPACE/examples/plans/backend_intern.selection.json" \
            --confirm-review > "$RUNNER_TEMP/resume-plan.json" || plan_status=$?
          test "$plan_status" -eq 3
          review_status=0
          "$RUNNER_TEMP/resumeforge-smoke/bin/resumeforge" review-resume \
            --profile "$GITHUB_WORKSPACE/examples/profiles/sample.md" \
            --job "$GITHUB_WORKSPACE/examples/jobs/backend_intern.md" \
            --requirements "$GITHUB_WORKSPACE/examples/jobs/backend_intern.response.json" \
            --selection "$GITHUB_WORKSPACE/examples/plans/backend_intern.selection.json" \
            --confirm-review > "$RUNNER_TEMP/resume-review.json" || review_status=$?
          test "$review_status" -eq 3
          "$RUNNER_TEMP/resumeforge-smoke/bin/python" - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidence-matching.json").read_text())
          assert report["signals_version"] == "evidence-signals-v1"
          candidates = [candidate for item in report["items"] for candidate in item["candidates"]]
          assert candidates and all("signals" in candidate for candidate in candidates)
          plan = json.loads(Path("resume-plan.json").read_text())
          assert plan["status"] == "needs_review" and plan["constraint_status"] == "conflicts"
          assert plan["budget"]["bullet_slot_count"] == 2
          assert any(f["code"] == "entry_bullet_minimum_not_met" for f in plan["findings"])
          review = json.loads(Path("resume-review.json").read_text())
          assert review["mode"] == "source_seed" and review["status"] == "blocked_by_plan"
          assert len(review["bullets"]) == 2
          assert all(b["review_status"] == "pending_review" for b in review["bullets"])
          PY
