[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "resumeforge"
version = "0.7.0"
description = "Evidence-first resume tailoring, built incrementally."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "PyYAML>=6.0.2,<7", "typer>=0.15,<1"]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "editables>=0.5,<1",
    "hatchling>=1.27,<2",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.11,<1",
    "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
resumeforge = "resumeforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/resumeforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = ["error"]
markers = ["integration: installed application or cross-component tests"]

[tool.coverage.run]
branch = true
source = ["resumeforge"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
